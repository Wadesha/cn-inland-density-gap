<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内陆高密度·低发展区带 · 省级入口</title>
<script src="./echarts.min.js"></script>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#2a2f3a;--txt:#e6e8eb;--muted:#8b95a5;--accent:#ffb454}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}
  header{padding:16px 22px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:18px;font-weight:600}
  .sub{color:var(--muted);margin-top:6px;font-size:12.5px}
  .wrap{display:grid;grid-template-columns:1fr 300px;gap:14px;padding:14px 22px;align-items:start}
  @media(max-width:880px){.wrap{grid-template-columns:1fr}}
  #map{width:100%;height:600px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .legend h3{margin:0 0 10px;font-size:13px;color:var(--accent)}
  .note{color:var(--muted);font-size:11.5px;line-height:1.6;margin-top:12px}
  .rank{margin-top:10px}
  .rank .r{display:flex;justify-content:space-between;padding:5px 8px;border-radius:6px;cursor:pointer}
  .rank .r:hover{background:#1e222b}
  a{color:var(--accent);text-decoration:none}
  #loading{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>内陆高密度 · 低发展区带</h1>
  <div class="sub">省级入口（首屏仅加载省级底图，几百 KB）。颜色越红 = 该省抽样的「密而弱」区县越多。<b style="color:#ffb454">仅红/橙省份有样本</b>，点击进入县级视图。</div>
</header>
<div class="wrap">
  <div class="card"><div id="loading">加载省级底图…</div><div id="map" style="display:none"></div></div>
  <div class="card legend">
    <h3>说明</h3>
    <div class="note">
      结构：<b>省入口 → 省内地县填色 → 单地详情页</b>。逐省加载，避免一次性拉取全县界（26MB）。
      红 = 密而弱（重点），蓝 = 密而强（同内陆对照）。稀疏侧不在数据集内。
      <br><br>机制：人口密度=农耕承载力；发展指数=非农附加值人均占有。「密而弱」是错配（农耕锁定）。
    </div>
    <div class="rank" id="rank"><h3 style="margin:0 0 6px">抽样密而弱 · 按省</h3></div>
  </div>
</div>
<script>
const PROV_MAP={'豫':'41','皖':'34','鲁':'37','冀':'13','苏':'32','鄂':'42','湘':'43','川':'51','陕':'61','赣':'36'};
(async()=>{
  let DATA=[];
  try{ DATA=await (await fetch('./data.json')).json(); }catch(e){}
  let geo={type:'FeatureCollection',features:[]};
  try{ geo=await (await fetch('./provinces.geojson')).json(); }catch(e){}

  // 每省密而弱计数
  const cnt={};
  DATA.filter(d=>d.type==='poor').forEach(d=>{cnt[d.prov]=(cnt[d.prov]||0)+1;});
  const maxc=Math.max(1,...Object.values(cnt));
  // 用省 adcode 前缀匹配计数（provinces.geojson 的 name 如 "河南省"）
  const data2=geo.features.map(f=>{
    const nm=f.properties&&f.properties.name; const ad=f.properties&&f.properties.adcode;
    const prefix=ad?String(ad).slice(0,2):null;
    // 找该 prefix 对应的 prov char
    let pc=null; for(const k in PROV_MAP) if(PROV_MAP[k]===prefix) pc=k;
    const c=pc?cnt[pc]:0;
    const color = c>0 ? `rgba(255,90,90,${0.25+0.75*c/maxc})` : '#171a21';
    return {name:nm, prefix, value:c, itemStyle:{color}};
  });

  document.getElementById('loading').style.display='none';
  document.getElementById('map').style.display='block';
  echarts.registerMap('cn', geo);
  const chart=echarts.init(document.getElementById('map'),'dark');
  chart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'item',formatter:p=>`<b>${p.name}</b><br/>抽样密而弱区县：${p.data.value} 个`},
    series:[{type:'map',map:'cn',roam:true,zoom:1.2,
      itemStyle:{borderColor:'#2a2f3a',borderWidth:0.5},
      emphasis:{itemStyle:{areaColor:'#2a2f3a'},label:{show:false}},
      data:data2}]
  });
  chart.on('click',p=>{ if(p.data&&p.data.prefix) location.href=`province.html?code=${p.data.prefix}`; });

  // 右侧排行
  const rank=document.getElementById('rank');
  Object.entries(cnt).sort((a,b)=>b[1]-a[1]).forEach(([pc,n])=>{
    const el=document.createElement('div'); el.className='r';
    el.innerHTML=`<span>${pc}</span><span style="color:var(--muted)">${n} 个</span>`;
    el.onclick=()=>location.href=`province.html?code=${PROV_MAP[pc]}`;
    rank.appendChild(el);
  });
  window.addEventListener('resize',()=>chart.resize());
})();
</script>
</body>
</html>
